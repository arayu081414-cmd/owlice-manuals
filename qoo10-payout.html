<title>Qoo10 入金設定マニュアル</title>

<style>
  :root {
    --accent:   #6f4fe0;
    --accent-2: #5235b8;
    --ink:      #16141f;
    --ink-2:    #5a5570;
    --ink-3:    #8b85a3;
    --paper:    #f2f1f7;
    --surface:  #ffffff;
    --line:     #e2dfec;
    --ok:       #0d7f58;
    --ok-soft:  #e3f5ed;
    --flag:     #a8700c;
    --flag-soft:#fdf3de;
    --bar:      rgba(247,246,251,.86);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent:#9d85f5; --accent-2:#c3b2ff;
      --ink:#ece9f6; --ink-2:#a8a2bf; --ink-3:#7a7493;
      --paper:#100e17; --surface:#1b1726; --line:#2e2840;
      --ok:#4fd3a0; --ok-soft:#11362a; --flag:#e8bf72; --flag-soft:#332814;
      --bar:rgba(16,14,23,.86);
    }
  }
  :root[data-theme="light"] {
    --accent:#6f4fe0; --accent-2:#5235b8;
    --ink:#16141f; --ink-2:#5a5570; --ink-3:#8b85a3;
    --paper:#f2f1f7; --surface:#ffffff; --line:#e2dfec;
    --ok:#0d7f58; --ok-soft:#e3f5ed; --flag:#a8700c; --flag-soft:#fdf3de;
    --bar:rgba(247,246,251,.86);
  }
  :root[data-theme="dark"] {
    --accent:#9d85f5; --accent-2:#c3b2ff;
    --ink:#ece9f6; --ink-2:#a8a2bf; --ink-3:#7a7493;
    --paper:#100e17; --surface:#1b1726; --line:#2e2840;
    --ok:#4fd3a0; --ok-soft:#11362a; --flag:#e8bf72; --flag-soft:#332814;
    --bar:rgba(16,14,23,.86);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic Medium',
                 'Noto Sans JP', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  text, tspan { font-feature-settings: 'palt' 1; }   /* 原本と同じ約物アキ詰め */

  /* ---- 固定ヘッダ ---- */
  .bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bar); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 11px max(16px, calc((100% - 960px) / 2));
  }
  .bar .who { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
  .bar .kick {
    font-size: 10px; font-weight: 700; letter-spacing: .14em; color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bar .name { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .bar button {
    appearance: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700;
    border-radius: 9px; padding: 9px 16px; white-space: nowrap;
  }
  .bar .jump { border: 0; background: var(--accent); color: #fff; }
  .bar .jump:hover { filter: brightness(1.08); }
  .bar .print { border: 1px solid var(--line); background: none; color: var(--ink-2); }
  .bar .print:hover { border-color: var(--accent); color: var(--accent); }
  .bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- スライド ---- */
  .deck { max-width: 960px; margin: 0 auto; padding: 22px 16px 70px;
          display: flex; flex-direction: column; gap: 20px; }
  .sheet {
    background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(29,20,61,.06), 0 10px 30px -14px rgba(29,20,61,.3);
  }
  svg.slide { display: block; width: 100%; height: auto; background: #fff; }

  /* ---- コピー欄 ---- */
  .tool {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px 26px 26px; scroll-margin-top: 78px;
  }
  .tool-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .tool-head h2 { margin: 0; font-size: 18px; }
  .tool-head .count {
    font-size: 12px; color: var(--ink-3);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  .tool p.lead { margin: 6px 0 20px; font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }
  .tool label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
  .tool label span { font-weight: 400; color: var(--ink-3); }
  .tool input[type=email] {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 15px;
    color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 9px;
  }
  .tool input[type=email]::placeholder { color: var(--ink-3); }
  .tool input[type=email]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent;
  }
  .tool .row { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; margin-top: 18px; }
  .tool button.go {
    appearance: none; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 700;
    padding: 13px 30px; transition: filter .12s ease, transform .08s ease;
  }
  .tool button.go:hover { filter: brightness(1.08); }
  .tool button.go:active { transform: translateY(1px); }
  .tool button.sub {
    appearance: none; background: none; cursor: pointer; border: 1px solid var(--line);
    border-radius: 9px; color: var(--ink-2); font: inherit; font-size: 13px; padding: 9px 15px;
  }
  .tool button.sub:hover { border-color: var(--accent); color: var(--accent); }
  .tool button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .tool .status {
    font-size: 13.5px; font-weight: 700; color: var(--ok); background: var(--ok-soft);
    padding: 6px 13px; border-radius: 999px; opacity: 0; transition: opacity .18s ease;
  }
  .tool .status.on { opacity: 1; }
  .tool .status.bad { color: var(--flag); background: var(--flag-soft); }
  .tool .warn {
    margin-top: 18px; background: var(--flag-soft); border-radius: 9px;
    padding: 12px 15px; font-size: 13px; color: var(--flag); font-weight: 700; line-height: 1.7;
  }
  footer { max-width: 960px; margin: 0 auto; padding: 0 16px 60px;
           font-size: 12.5px; color: var(--ink-3); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 560px) {
    .bar { padding: 10px 14px; }
    .bar .print { display: none; }
    .tool { padding: 18px 16px 20px; }
    .tool button.go { width: 100%; }
  }

  /* ---- 印刷すると配布PDFと同じ体裁になる ---- */
  @page { size: 720pt 404.88pt; margin: 0; }
  @media print {
    body { background: #fff; }
    .bar, .tool, footer { display: none !important; }
    .deck { max-width: none; margin: 0; padding: 0; gap: 0; display: block; }
    .sheet { border-radius: 0; box-shadow: none; }
    svg.slide { width: 720pt; height: 404.88pt; break-after: page; }
    .sheet:last-of-type svg.slide { break-after: auto; }
  }
</style>

<div class="sheet"><svg class="slide" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" xml:space="preserve"><text x="36" y="43" font-size="11" fill="#555555" font-weight="600" textLength="133" lengthAdjust="spacing">Open Shop Info Page</text><text x="36" y="79" font-size="24" fill="#1a1a1a" font-weight="900">ショップ情報ページを開く</text><rect x="36" y="99" width="4" height="21" fill="#6f4fe0"/><text x="50" y="114" font-size="14" fill="#1a1a1a" font-weight="800">J·QSM から「ショップページ」タブを表示する</text><circle cx="46" cy="143" r="10" fill="#6f4fe0"/><text x="46" y="148" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="66" y="145" font-size="13" fill="#1a1a1a" font-weight="800">「基本情報」→「ショップ管理」</text><text x="66" y="164" font-size="11"><tspan fill="#555555" font-weight="400">左サイドバーの </tspan><tspan fill="#555555" font-weight="700">「基本情報」</tspan><tspan fill="#555555" font-weight="400">を開き、</tspan><tspan fill="#555555" font-weight="700">「ショップ管理」</tspan><tspan fill="#555555" font-weight="400">をクリックします。</tspan></text><circle cx="46" cy="196" r="10" fill="#6f4fe0"/><text x="46" y="201" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="66" y="198" font-size="13" fill="#1a1a1a" font-weight="800">「ショップページ」タブを選ぶ</text><text x="66" y="217" font-size="11"><tspan fill="#555555" font-weight="400">上部に並ぶタブから </tspan><tspan fill="#555555" font-weight="700">「ショップページ」</tspan><tspan fill="#555555" font-weight="400">をクリックします。</tspan></text><circle cx="46" cy="249" r="10" fill="#6f4fe0"/><text x="46" y="254" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="66" y="251" font-size="13" fill="#1a1a1a" font-weight="800">下までスクロール</text><text x="66" y="270" font-size="11"><tspan fill="#555555" font-weight="400">「お知らせ」の下へスクロールすると </tspan><tspan fill="#555555" font-weight="700">「ショップ情報ページのHTML」</tspan></text><text x="65.5" y="287" font-size="11"><tspan fill="#5 <div class="sheet"><svg class="slide" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" xml:space="preserve"><text x="36" y="43" font-size="11" fill="#555555" font-weight="600" textLength="168" lengthAdjust="spacing">Paste into PC and Mobile</text><text x="36" y="79" font-size="24" fill="#1a1a1a" font-weight="900">PC・Mobile 両方に貼り付ける</text><rect x="36" y="99" width="4" height="21" fill="#6f4fe0"/><text x="50" y="114" font-size="14" fill="#1a1a1a" font-weight="800">コピー用ページから、同じ本文を2か所に貼る</text><circle cx="46" cy="143" r="10" fill="#6f4fe0"/><text x="46" y="148" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="66" y="145" font-size="13" fill="#1a1a1a" font-weight="800">コピー用ページで本文をコピー</text><text x="66" y="164" font-size="11"><tspan fill="#555555" font-weight="400">このページのすぐ下にある </tspan><tspan fill="#555555" font-weight="700">コピー欄</tspan><tspan fill="#555555" font-weight="400"> で、ショップの</tspan></text><text x="65.5" y="181" font-size="11"><tspan fill="#555555" font-weight="400">メールアドレスを入れて </tspan><tspan fill="#555555" font-weight="700">「本文をコピー」</tspan><tspan fill="#555555" font-weight="400">を押します。</tspan></text><circle cx="46" cy="206" r="10" fill="#6f4fe0"/><text x="46" y="211" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="66" y="208" font-size="13" fill="#1a1a1a" font-weight="800">「PC」タブに貼り付けて保存</text><text x="66" y="227" font-size="11"><tspan fill="#555555" font-weight="400">「ショップ情報ページのHTML」の </tspan><tspan fill="#555555" font-weight="700">「PC」</tspan><tspan fill="#555555" font-weight="400">タブを選び、貼り付けてから</tspan></text><text x="65.5" y="244" font-size="11"><tspan fill="#555555" font-weight="400">下の </tspan><tspan fill="#555555" font-weight="700">「保存」</tspan><tspan fill="#555555" font-weight="400">を押します。</tspan></text><circle cx="46" cy="269" r="10" fill="#6f4fe0"/><text x="46" y="274" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="66" y="271" font-size="13" fill="#1a1a1a" font-weight="800">「Mobile」タブに貼り付けて保存</text><text x="66" y="290" font-size="11"><tspan fill="#555555" font-weight="400">タブを </tspan><tspan fill="#555555" font-weight="700">「Mobile」</tspan><tspan fill="#555555" font-weight="400">に切り替え、同じ本文をもう一度貼り付けて</tspan></text><text x="65.5" y="307" font-size="11"><tspan fill="#555555" font-weight="700">「保存」</tspan><tspan fill="#555555" font-weight="400">を押します。</tspan></text><rect x="36" y="325" width="431" height="100" fill="#fff4e0" rx="8"/><rect x="48" y="338" width="36" height="19" fill="#f39c12" rx="4"/><text x="56" y="351" font-size="10" fill="#ffffff" font-weight="700">注意</text><text x="48" y="374" font-size="11" fill="#f39c12" font-weight="700" font-family="'Lucida Grande',sans-serif">▸</text><text x="60" y="374" font-size="11"><tspan fill="#b8860b" font-weight="700">PCとMobileは別設定です。</tspan><tspan fill="#5235b8" font-weight="700">片方だけでは もう片方が空のまま</tspan><tspan fill="#b8860b" font-weight="700"> になります</tspan></text><text x="48" y="392" font-size="11" fill="#f39c12" font-weight="700" font-family="'Lucida Grande',sans-serif">▸</text><text x="60" y="392" font-size="11"><tspan fill="#5235b8" font-weight="700">E-mail:</tspan><tspan fill="#b8860b" font-weight="700"> は </tspan><tspan fill="#5235b8" font-weight="700">ショップごとに違います</tspan><tspan fill="#b8860b" font-weight="700">。コピー用ページで入力できます</tspan></text><text x="48" y="410" font-size="11" fill="#f39c12" font-weight="700" font-family="'Lucida Grande',sans-serif">▸</text><text x="60" y="410" font-size="11"><tspan fill="#b8860b" font-weight="700">10〜12ページの本文をなぞってコピーすると、改行や文字の並びが崩れます</tspan></text><g filter="url(#cardShadow)"><rect x="494" y="101" width="430" height="417" fill="#ffffff" rx="12"/></g><image href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC FBA マルチチャンネルとは Amazon 以外の販売経路で販売している商品の在庫管理・出荷・配送、返品業務など物流に関わる全てを Amazon が代行して行うサービスになります。

発送業務は一部委託しておりますので、発送にかかわる交渉は対応致しかねます。 発送の手配は通常、支払い完了後、1～3 日以内にお手続きを行います。そのため最短で商品が到着いたします。

◆海外発送・郵便局止め・ヤマト営業所止め、コンビニ受け取り、着払いは対応できません。

◆配送業者・配送方法の指定は承れません。

◆送料は購入価格に含まれています。 商品の大小や重さに関わらず送料込みの価格で販売しております。（表記は送料無料としています）

-払い戻し・返品についての注意事項-
◆お客様都合での交換，返品，返金は基本的にお受けしておりません。

◆配送や，商品問題があった場合の，返品対応は商品到着から 7 日以内とさせていただきますので、ご注意ください。
（Qoo10 のシステムでは７日以上経過すると返品や、返金申請ができなくなるのでご注意ください。）

◆お客様都合での返品・キャンセル、宛先不明や長期ご不在で、出荷した商品が当ショップに返送された場合、往復送料・梱包資材料・手数料 等をご負担頂きますのでご注意下さい。

◆発送時には検品をしておりますが、万が一不良品の場合は初期不良のみ対応させていただきますので商品が到着しましたら必ず中身の確認をお願いいたします。

◆決済完了後のご購入者様都合でのキャンセルはお受けできかねますので予めご了承ください。

◆商品に初期不良などがある場合は、返品確認後に返金、またはご交換の対応になりますのでご了承下さい。
（返品された商品を確認し、初期不良が認められない場合には往復送料・梱包資材料・手数料 等を差し引いた商品代金の返金になりますのでご注意下さい。）

◆商品に初期不良などによる返品をご希望の場合、商品を送る前にまずはご連絡をお願いします。返品先は商品により異なるため、返品受付時にお知らせします。
（返品業務も委託しているため）

◆ お客様がご使用になられた商品は返品・交換をお断りさせていただきます。

◆その他、誤って購入した場合などお客様都合での返品・交換をお断りさせていただきます。
（使用方法がわからず、初期不良の勘違いなども）

-よくあるお問い合わせ-
◆領収書の発行については MyQoo10 ページより発行可能です。詳しくは下記のリンクよりご確認下さい。

キャンセルと返品の方法と手順

・スマホ・アプリでのキャンセル、返品手順
STEP.1 画面一番下にある「MY」をクリックし、「MY Qoo10」を開く
STEP.2 「購入履歴」の項目から「キャンセル/払い戻し」をクリック
STEP.3 キャンセル・返品したい商品の「キャンセル要請」or「返品要請」をクリック
STEP.4 「キャンセルの理由」を選択し、「続ける」をクリック（キャンセル理由などは未記入でも大丈夫です）
STEP.5 キャンセルの金額など確認し、「続ける」をクリックで手続き完了です。

・パソコンでのキャンセル、返品手順
STEP.1 画面の一番上にある「My Qoo10」をクリック
STEP.2 「購入履歴」「Q サイフ」「My リスト」「My 情報」と並んでいる中から「購入履歴」を選択し「キャンセル/払い戻し/未配送」をクリック
STEP.3 「キャンセル/払い戻し」をクリック
STEP.4 キャンセルしたい商品を選択し、チェックを入れて「キャンセル要請」をクリック
STEP.5 「キャンセル／返品」の理由を選択し、「続ける」をクリック（キャンセル理由などは未記入でも大丈夫です）
STEP.6 「キャンセルの金額」など確認し、「要請完了」をクリックで手続完了です。

キャンセル、返品、返金について、その他注意事項
◆クーポンを利用して購入した場合、購入金額と返金額が違う可能性があります。諸費用の覧に記載されていますので、確認して下さい。

◆キャンセルや返品について販売店の承認が必要な場合には販売店が承認/拒否をするとメールが届きます。

◆キャンセルの方法についてさらに詳しい方法については、下記のリンクに注文をキャンセルする手順が説明されていますので、ご確認をお願いします。
https://www.qoo10.jp/gmkt.inc/CS/NHelpFaqList.aspx?searchkind=E6

◆返金はどのようにされるかについては下記のリンクに説明されていますのでご確認下さい。
https://www.qoo10.jp/gmkt.inc/CS/NHelpFaqContents.aspx?viewno=6080

お問い合わせの方法

・スマホ・アプリでのお問い合わせ方法
STEP.1 画面一番下にある「MY」をクリックし、「MY Qoo10」を開く
STEP.2 アプリの場合は、画面右上の方にある「Qpost」をクリック スマホの場合は画面下の方にある「My 情報」の項目にある「Qpost」をクリック
STEP.3 「お問い合わせ」をクリック
STEP.4 「カテゴリを選択」の中からお問い合わせ内容にあったものを選択し、「注文内訳」の中からお問い合わせする商品を選択する。
STEP.5 お問い合わせする内容を書き込み、「送る」で送信したら完了です
STEP.6 「タイトル」やお問い合わせ内容を記入して「送る」をクリックすると完了です

・パソコンでのお問い合わせ方法
STEP.1 画面の一番上にある「My Qoo10」をクリック
STEP.2 「購入履歴」「Q サイフ」「My リスト」「My 情報」と並んでいる中から「購入履歴」をクリック
STEP.3 問い合わせたい商品を選択してダブルクリック
STEP.4 商品の価格の下辺りに「質問およびショップとのチャット」という表示が出るので「質問およびショップとのチャット」をクリックし、「＠メール」をクリック
STEP.5 「カテゴリ」から「配送」「キャンセル／払い戻し」「その他」「商品の情報」の中から問い合わせ内容のものを選択する
STEP.6 「タイトル」やお問い合わせ内容を記入して「送る」をクリックすると完了です

著作権について

万が一、当ショップが取り扱う商品で著作権に反する商品などが確認された場合は、下記のメールアドレスにてご連絡をお願いいたします。
直ちに該当する商品の出品は取り下げ、仕入先に事実確認を行い、違反行為がないよう早急に改善いたします。
法令遵守でショップ運営をしてまいりますので、何かありましたらご連絡をお願いいたします。

ャンセル/払い戻し」をクリック</text><text x="495" y="393" font-size="10" fill="#1a1a1a" font-weight="400">STEP.4 キャンセルしたい商品を選択し、チェックを入れて「キャンセル要請」をクリッ</text><text x="495" y="407.5" font-size="10" fill="#1a1a1a" font-weight="400">ク</text><text x="495" y="422" font-size="10" fill="#1a1a1a" font-weight="400">STEP.5 「キャンセル／返品」の理由を選択し、「続ける」をクリック（キャンセル理由</text><text x="495" y="436.5" font-size="10" fill="#1a1a1a" font-weight="400">などは未記入でも大丈夫です）</text><text x="495" y="451" font-size="10" fill="#1a1a1a" font-weight="400">STEP.6 「キャンセルの金額」など確認し、「要請完了」をクリックで手続完了です。</text><text x="495" y="480" font-size="10" fill="#1a1a1a" font-weight="400">キャンセル、返品、返金について、その他注意事項</text><text x="936" y="30" font-size="12" fill="#999999" font-weight="700" text-anchor="end">11</text></svg></div>
<div class="sheet"><svg class="slide" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" xml:space="preserve"><text x="36" y="43" font-size="11" fill="#555555" font-weight="600" textLength="91" lengthAdjust="spacing">Text to Paste</text><text x="36" y="79" font-size="22" fill="#1a1a1a" font-weight="900">貼り付けるテキスト（3/3）</text><rect x="36" y="110" width="442" height="394.5" fill="#f7f7fa" rx="8"/><text x="49" y="132" font-size="10" fill="#1a1a1a" font-weight="400">◆クーポンを利用して購入した場合、購入金額と返金額が違う可能性があります。諸費用</text><text x="49" y="146.5" font-size="10" fill="#1a1a1a" font-weight="400">の覧に記載されていますので、確認して下さい。</text><text x="49" y="175.5" font-size="10" fill="#1a1a1a" font-weight="400">◆キャンセルや返品について販売店の承認が必要な場合には販売店が承認/拒否をするとメー</text><text x="49" y="190" font-size="10" fill="#1a1a1a" font-weight="400">ルが届きます。</text><text x="49" y="219" font-size="10" fill="#1a1a1a" font-weight="400">◆キャンセルの方法についてさらに詳しい方法については、下記のリンクに注文をキャン</text><text x="49" y="233.5" font-size="10" fill="#1a1a1a" font-weight="400">セルする手順が説明されていますので、ご確認をお願いします。</text><text x="49" y="248" font-size="10" fill="#1a1a1a" font-weight="400">https://www.qoo10.jp/gmkt.inc/CS/NHelpFaqList.aspx?searchkind=E6</text><text x="49" y="277" font-size="10" fill="#1a1a1a" font-weight="400">◆返金はどのようにされるかについては下記のリンクに説明されていますのでご確認下さ</text><text x="49" y="291.5" font-size="10" fill="#1a1a1a" font-weight="400">い。</text><text x="49" y="306" font-size="10" fill="#1a1a1a" font-weight="400">https://www.qoo10.jp/gmkt.inc/CS/NHelpFaqContents.aspx?viewno=6080</text><text x="49" y="335" font-size="10" fill="#1a1a1a" font-weight="400">お問い合わせの方法</text><text x="49" y="364" font-size="10" fill="#1a1a1a" font-weight="400">・スマホ・アプリでのお問い合わせ方法</text><text x="49" y="378.5" font-size="10" fill="#1a1a1a" font-weight="400">STEP.1 画面一番下にある「MY」をクリックし、「MY Qoo10」を開く</text><text x="49" y="393" font-size="10" fill="#1a1a1a" font-weight="400">STEP.2 アプリの場合は、画面右上の方にある「Qpost」をクリック スマホの場合は画面</text><text x="49" y="407.5" font-size="10" fill="#1a1a1a" font-weight="400">下の方にある「My 情報」の項目にある「Qpost」をクリック</text><text x="49" y="422" font-size="10" fill="#1a1a1a" font-weight="400">STEP.3 「お問い合わせ」をクリック</text><text x="49" y="436.5" font-size="10" fill="#1a1a1a" font-weight="400">STEP.4 「カテゴリを選択」の中からお問い合わせ内容にあったものを選択し、「注文内</text><text x="49" y="451" font-size="10" fill="#1a1a1a" font-weight="400">訳」の中からお問い合わせする商品を選択する。</text><text x="49" y="465.5" font-size="10" fill="#1a1a1a" font-weight="400">STEP.5 お問い合わせする内容を書き込み、「送る」で送信したら完了です</text><text x="49" y="480" font-size="10" fill="#1a1a1a" font-weight="400">STEP.6 「タイトル」やお問い合わせ内容を記入して「送る」をクリックすると完了です</text><rect x="482" y="110" width="442" height="394.5" fill="#f7f7fa" rx="8"/><text x="495" y="146.5" font-size="10" fill="#1a1a1a" font-weight="400">・パソコンでのお問い合わせ方法</text><text x="495" y="161" font-size="10" fill="#1a1a1a" font-weight="400">STEP.1 画面の一番上にある「My Qoo10」をクリック</text><text x="495" y="175.5" font-size="10" fill="#1a1a1a" font-weight="400">STEP.2 「購入履歴」「Q サイフ」「My リスト」「My 情報」と並んでいる中から「購入</text><text x="495" y="190" font-size="10" fill="#1a1a1a" font-weight="400">履歴」をクリック</text><text x="495" y="204.5" font-size="10" fill="#1a1a1a" font-weight="400">STEP.3 問い合わせたい商品を選択してダブルクリック</text><text x="495" y="219" font-size="10" fill="#1a1a1a" font-weight="400">STEP.4 商品の価格の下辺りに「質問およびショップとのチャット」という表示が出るの</text><text x="495" y="233.5" font-size="10" fill="#1a1a1a" font-weight="400">で「質問およびショップとのチャット」をクリックし、「＠メール」をクリック</text><text x="495" y="248" font-size="10" fill="#1a1a1a" font-weight="400">STEP.5 「カテゴリ」から「配送」「キャンセル／払い戻し」「その他」「商品の情報」</text><text x="495" y="262.5" font-size="10" fill="#1a1a1a" font-weight="400">の中から問い合わせ内容のものを選択する</text><text x="495" y="277" font-size="10" fill="#1a1a1a" font-weight="400">STEP.6 「タイトル」やお問い合わせ内容を記入して「送る」をクリックすると完了です</text><text x="495" y="306" font-size="10" fill="#1a1a1a" font-weight="400">著作権について</text><text x="495" y="335" font-size="10" fill="#1a1a1a" font-weight="400">万が一、当ショップが取り扱う商品で著作権に反する商品などが確認された場合は、下記</text><text x="495" y="349.5" font-size="10" fill="#1a1a1a" font-weight="400">のメールアドレスにてご連絡をお願いいたします。</text><text x="495" y="364" font-size="10" fill="#1a1a1a" font-weight="400">直ちに該当する商品の出品は取り下げ、仕入先に事実確認を行い、違反行為がないよう早</text><text x="495" y="378.5" font-size="10" fill="#1a1a1a" font-weight="400">急に改善いたします。</text><text x="495" y="393" font-size="10" fill="#1a1a1a" font-weight="400">法令遵守でショップ運営をしてまいりますので、何かありましたらご連絡をお願いいたし</text><text x="495" y="407.5" font-size="10" fill="#1a1a1a" font-weight="400">ます。</text><text x="495" y="436.5" font-size="10" fill="#1a1a1a" font-weight="400">E-mail:</text><rect x="491" y="425.5" width="56" height="15" rx="4" fill="none" stroke="#db0f0f" stroke-width="2"/><path d="M611 433 L553 433" stroke="#db0f0f" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M562.00 428.00 L553 433 L562.00 438.00" stroke="#db0f0f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="617" y="436.5" font-size="10" fill="#db0f0f" font-weight="700">ショップごとに違います。自分のアドレスを入れてください</text><text x="936" y="30" font-size="12" fill="#999999" font-weight="700" text-anchor="end">12</text></svg></div>

<script>
  document.getElementById('doPrint').addEventListener('click', function () { window.print(); });
  document.getElementById('doJump').addEventListener('click', function () {
    document.getElementById('tool').scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(function () { document.getElementById('tMail').focus({ preventScroll: true }); }, 450);
  });
</script>

<script>
(function () {
  var SRC    = document.getElementById('tSrc').value;
  var mail   = document.getElementById('tMail');
  var status = document.getElementById('tStatus');
  var count  = document.getElementById('tCount');
  var timer  = null;

  // 本文は「E-mail:」+改行 で終わる。行末アンカーの正規表現だと改行に阻まれて
  // 差し込みが黙って失敗するので、位置を直接探して入れる。
  function build() {
    var m = mail.value.trim();
    if (!m) return SRC;
    var key = 'E-mail:';
    var at = SRC.lastIndexOf(key);
    if (at === -1) return SRC;
    var head = SRC.slice(0, at + key.length);
    var tail = SRC.slice(at + key.length);
    return head + ' ' + m + tail.replace(/^[ \t]+/, '');   // 末尾の改行は残す
  }
  function refresh() {
    count.textContent = build().replace(/\n/g, '').length.toLocaleString('ja-JP') + ' 文字';
  }
  function say(msg, bad) {
    status.textContent = msg;
    status.classList.toggle('bad', !!bad);
    status.classList.add('on');
    clearTimeout(timer);
    timer = setTimeout(function () { status.classList.remove('on'); }, 2600);
  }
  function legacy(text) {               // クリップボードAPIが使えない環境向け
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(
        function () { return true; }, function () { return legacy(text); });
    }
    return Promise.resolve(legacy(text));
  }

  mail.addEventListener('input', refresh);
  document.getElementById('tCopy').addEventListener('click', function () {
    copyText(build()).then(function (ok) {
      if (ok) say('コピーしました');
      else say('下のページの本文を選択してコピーしてください', true);
    });
  });
  document.getElementById('tSave').addEventListener('click', function () {
    var url = URL.createObjectURL(new Blob([build()], { type: 'text/plain;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ショップ情報ページ本文.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    say('保存しました');
  });
  refresh();
})();
</script>
